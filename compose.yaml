name: dulio-shortener

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    user: "${DULIO_UID:-1000}:${DULIO_GID:-1000}"
    environment:
      DATABASE_PATH: /data/dulio.db
      DULIO_BASE_HOSTNAME: "${DULIO_BASE_HOSTNAME:-3dreamstudio.com.br}"
      AUTH_TOKEN_TTL: "${AUTH_TOKEN_TTL:-24h}"
      SHUTDOWN_TIMEOUT: "${SHUTDOWN_TIMEOUT:-10s}"
      SONYFLAKE_MACHINE_ID: "${SONYFLAKE_MACHINE_ID:-0}"
    ports:
      - "${DULIO_HTTP_PORT:-443}:443"
    volumes:
      - ./data:/data

  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: database/Dockerfile
    user: "${DULIO_UID:-1000}:${DULIO_GID:-1000}"
    environment:
      DATABASE_PATH: /data/dulio.db
    volumes:
      - ./data:/data
